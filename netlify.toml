[build]
  command = "npm run build"
  publish = "dist"

# La app pregunta por este archivo para saber si hay versión nueva: nunca guardarlo en caché.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# La página principal tampoco, así cada recarga trae la última versión.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Los archivos de /assets llevan un código en el nombre que cambia en cada versión:
# el navegador los puede guardar para siempre y no los vuelve a descargar en cada visita.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Todas las rutas las resuelve la app (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
